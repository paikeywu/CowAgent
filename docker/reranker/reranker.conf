; ---------------------------------------------------------------------------
; BGE Reranker service configuration -- THE single source of truth.
;
; Everything that describes HOW the reranker runs lives here:
;   - the manual start (start-reranker.bat)
;   - the Windows service (CowReranker.exe -> cmd.exe -> start-reranker.bat)
;
; Both entry points read this file, so a change here changes both. Nothing
; else is allowed to repeat these values -- an earlier version had the model
; directory in three places (this file, the .bat and the service XML), which
; is exactly how a silent "service starts but every request fails" happens.
;
; Format: INI. Read by serve.py (configparser, no interpolation, so "%" in a
; path is safe). Deliberately NOT read by the batch file: parsing INI in cmd
; is where quoting bugs live, and the .bat only needs to know where the
; interpreter and this file are -- which is "how to find myself", not a
; service parameter.
; ---------------------------------------------------------------------------

[reranker]

; Directory holding the BGE-reranker-v2-m3 weights (config.json,
; tokenizer.json, tokenizer_config.json must be present here).
model_dir = C:\Users\User\cow\models\bge-reranker-v2-m3

; Bind to loopback only. The service is not exposed to the network.
host = 127.0.0.1
port = 9898

; torch thread count. 0 = leave the server default. The container image
; would otherwise read every host core and oversubscribe on a 4-core box.
threads = 4

; Max input length in tokens; longer inputs get truncated by the tokenizer.
max_length = 1024

; Where the detached (non-service) mode writes its stdout/stderr.
; The service mode does NOT use this -- WinSW captures the output itself.
log = C:\Users\User\cow\reranker-server.log
